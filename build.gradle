// Root build. The mods are subprojects; this file holds the checks the build runs, each a Python
// script that reads files and starts nothing. CLAUDE.md non-negotiable 2 is what they enforce;
// docs/NEXT.md lists them. checkRecipes skips itself when Wube's gitignored dump is absent.

[checkRecipes: ['tools/gen_recipes.py', ['--check'],
                'Diffs generated recipes against the ones committed to each mod.',
                'Recipes on disk disagree with the generator. Regenerate them rather than editing by hand: python tools/gen_recipes.py --write'],
 checkTechnologies: ['tools/gen_technologies.py', ['--check'],
                     'Diffs the generated technology tree against the one committed to nauvis_research.',
                     'The technology tree on disk disagrees with the generator: python tools/gen_technologies.py --write'],
 checkRemovals: ['tools/gen_removals.py', ['--check'],
                 'Diffs the vanilla-recipe removals against data/removals.json.',
                 'The vanilla-recipe removals on disk disagree with data/removals.json: python tools/gen_removals.py --write'],
 checkModels: ['tools/check_models.py', [],
               'Follows every blockstate, model, parent and texture reference to a real file.',
               'A model, texture or blockstate the pack names does not exist. See docs/PITFALLS.md.'],
 checkGuiLayout: ['tools/check_gui_layout.py', [],
                  'Checks the machine screens for boxes drawn through each other.',
                  'Two things on a machine screen overlap. The constants are read out of the source, so fix them there.']
].each { name, spec ->
    def (scriptPath, args, describe, complaint) = spec

    tasks.register(name) {
        group = 'verification'
        description = describe

        def script = file(scriptPath)
        def dump = file('reference/factorio/recipes.json')
        inputs.file(script).withPropertyName('script')
        outputs.upToDateWhen { false }

        doLast {
            if (name == 'checkRecipes' && !dump.exists()) {
                logger.lifecycle("checkRecipes: skipped, ${dump} is absent (gitignored - see reference/README.md)")
                return
            }
            // ProcessBuilder rather than exec {}, which is gone from task actions in Gradle 9.
            def process = new ProcessBuilder(['python', script.absolutePath] + args)
                    .directory(projectDir)
                    .redirectErrorStream(true)
                    .start()
            def output = process.inputStream.text
            def exitValue = process.waitFor()
            logger.lifecycle(output)
            if (exitValue != 0) {
                throw new GradleException(complaint)
            }
        }
    }
}
