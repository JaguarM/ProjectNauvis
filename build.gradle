// Root build. The mods are subprojects; this file holds only what applies to the repo.

/**
 * Non-negotiable #2, enforced rather than remembered.
 *
 * Diffs every recipe on disk against what the generator produces from Factorio's dump. A
 * hand-edited recipe, or one left behind when the mapping changed, fails the build instead of
 * reaching a world save.
 *
 * Skips itself when reference/factorio/recipes.json is absent. That file is Wube's and
 * gitignored, so a fresh clone has no copy and must still be able to build.
 */
tasks.register('checkRecipes') {
    group = 'verification'
    description = "Diffs generated recipes against the ones committed to each mod."

    def dump = file('reference/factorio/recipes.json')
    def mapping = file('data/mapping.json')
    def script = file('tools/gen_recipes.py')

    inputs.file(mapping).withPropertyName('mapping')
    inputs.file(script).withPropertyName('generator')
    outputs.upToDateWhen { false }

    doLast {
        if (!dump.exists()) {
            logger.lifecycle("checkRecipes: skipped, ${dump} is absent (it is gitignored - see reference/README.md)")
            return
        }

        // ProcessBuilder rather than Gradle's exec {}, which is gone from task actions in
        // Gradle 9 and would otherwise need an injected ExecOperations for a one-line call.
        def process = new ProcessBuilder('python', script.absolutePath, '--check')
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
        def output = process.inputStream.text
        def exitValue = process.waitFor()

        logger.lifecycle(output)

        if (exitValue != 0) {
            throw new GradleException(
                    "Recipes on disk disagree with the generator. Regenerate them rather than " +
                    "editing by hand: python tools/gen_recipes.py --write")
        }
    }
}

/**
 * The checks that need no game, wired in so they actually run.
 *
 * Every visual bug this pack has shipped compiled, passed its tests and passed datagen. What
 * caught them was a person looking at the game, which is not a process. These two look at what
 * datagen wrote rather than at what it was asked to write, which is where the difference lives.
 *
 * Both read files and start nothing, so they cost a second and can run on any tree.
 */
['checkModels': ['tools/check_models.py',
                 'Follows every blockstate, model, parent and texture reference to a real file.',
                 'A model, texture or blockstate the pack names does not exist. Nothing about ' +
                 'that fails a compile or a datagen run - see docs/NEXT.md.'],
 'checkGuiLayout': ['tools/check_gui_layout.py',
                    'Checks the machine screens for boxes drawn through each other.',
                    'Two things on a machine screen overlap. The constants are read out of the ' +
                    'source, so fix them there.']].each { name, spec ->
    def (scriptPath, describe, complaint) = spec

    tasks.register(name) {
        group = 'verification'
        description = describe

        def script = file(scriptPath)
        inputs.file(script).withPropertyName('checker')
        outputs.upToDateWhen { false }

        doLast {
            // ProcessBuilder rather than Gradle's exec {}, for the reason given above.
            def process = new ProcessBuilder('python', script.absolutePath)
                    .directory(projectDir)
                    .redirectErrorStream(true)
                    .start()
            def output = process.inputStream.text
            def exitValue = process.waitFor()

            logger.lifecycle(output)

            if (exitValue != 0) {
                throw new GradleException(complaint)
            }
        }
    }
}
