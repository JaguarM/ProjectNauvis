org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Shared across every subproject here. The four included builds carry their own copies of
# these, and all five must agree - a mismatch shows up as a mod refusing to load, not as a
# build failure.
minecraft_version=26.2
minecraft_version_range=[26.2,)
neo_version=26.2.0.59

# The released siblings, at the coordinates their maven-publish blocks produce. Version
# ranges are deliberately exact: includeBuild substitutes the local checkout regardless, and
# an exact version is what a standalone build of this pack would need.
facrafting_version=0.2.0

neoprogressivematerials_version=1.0.0
neoprogressiveautomation_version=1.1.0
crumblingore_version=1.0.0

# Jade, from the Modrinth maven. Compile-only in the subsystem mods and runtime in the pack:
# the readout is worth having and no mod is allowed to need it.
jade_version=26.2.9+neoforge
