plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

ext {
    mod_id = 'nauvis_machines'
    mod_name = 'Nauvis Machines'
}

version = '0.1.0'
group = 'com.jaguarm.nauvismachines'

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    // Two generated roots, not one. Each datagen run deletes output it does not recognise, so
    // pointing both at the same directory makes whichever ran last wipe the other's work.
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/*.bbmodel'
    exclude '**/.cache'
}

repositories {
    // See docs/API-26.2.md: the NeoForged mirror intermittently serves zero-byte files with
    // HTTP 200 for these groups. exclusiveContent makes Central the only source for them.
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }

    mavenCentral()
}

dependencies {
    // The one compile-time dependency in the pack, and a deliberate one. An assembler runs
    // Facrafting's timed recipes: it reads FacraftRecipe's ingredients and craft_ticks, and
    // pays for a craft through CraftPlanner. That is Java, not a recipe condition, so the
    // arrow is real - and it points one way only, which non-negotiable #3 allows. The pack
    // mod and the other siblings still depend on nothing at compile time.
    implementation "com.jaguarm.facrafting:facrafting:${facrafting_version}"

    // Not a code dependency: the assembler's own recipe is paid for in electronic circuits
    // and iron gear wheels, so a standalone run of this mod needs the mod that has them.
    runtimeOnly "com.jaguarm.neoprogressivematerials:neoprogressivematerials:${neoprogressivematerials_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered gametest, then exits - non-zero if any failed. The pack's own
        // :nauvis:runGameTestServer runs these too, on a classpath with all five mods.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Client and server datagen are separate runs since 1.21.4. Models and language go
        // through clientData, loot tables and tags through serverData; running only one
        // silently generates half of what you asked for.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the properties in src/main/templates into the mod metadata.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            facrafting_version     : facrafting_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : 'MIT',
            mod_version            : version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Recipes are generated, never hand-written - so a build that would ship a hand-edited one
// should not succeed. See the root build.gradle.
tasks.named('check') {
    dependsOn rootProject.tasks.named('checkRecipes')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
