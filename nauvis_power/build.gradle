plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

ext {
    mod_id = 'nauvis_power'
    mod_name = 'Nauvis Power'
}

version = '0.1.0'
group = 'com.jaguarm.nauvispower'

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    // Two generated roots, not one. Each datagen run deletes output it does not recognise, so
    // pointing both at the same directory makes whichever ran last wipe the other's work.
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/*.bbmodel'
    exclude '**/.cache'
}

repositories {
    // See docs/API-26.2.md: the NeoForged mirror intermittently serves zero-byte files with
    // HTTP 200 for these groups. exclusiveContent makes Central the only source for them.
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }

    mavenCentral()

    // Jade, for the look-at readout. See docs/PLAN.md - it is the one mod in the ecosystem
    // actually on 26.2, and its plugin classes only load when it is present.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // The code every machine here is built on: multi-blocks, the views a machine publishes,
    // the screen it is drawn on. The one compile-time dependency between the pack's own mods,
    // and it points one way - the library depends on nothing of ours.
    implementation project(':nauvis_lib')

    // No compile-time dependency, deliberately. An inserter moves items between whatever is
    // beside it through Capabilities.Item.BLOCK, which is NeoForge's - it never needs to know
    // what a Facrafting recipe is. nauvis_machines is the one mod in the pack that compiles
    // against a sibling, and it should stay the only one.
    //
    // These two are runtime only, so a standalone run of this mod has the mods its recipes
    // name: Facrafting supplies the timed recipe type, Neo Progressive Materials the iron
    // gear wheel an inserter is paid for in.
    // All runtime only - no compile dependency on any of them. A boiler is paid for in pipes and
    // a steam engine in gear wheels, so a standalone run needs the mods that have them for those
    // recipes to load. The blocks themselves work regardless.
    runtimeOnly "com.jaguarm.facrafting:facrafting:${facrafting_version}"
    runtimeOnly "com.jaguarm.neoprogressivematerials:neoprogressivematerials:${neoprogressivematerials_version}"
    runtimeOnly project(':nauvis_fluids')
    // And the boiler is paid for in a stone furnace, which is a machine of nauvis_machines.
    runtimeOnly project(':nauvis_machines')

    // compileOnly, never implementation: the @WailaPlugin class is only loaded when Jade is
    // there, so this mod still runs standalone without it and nothing has to be declared
    // required in neoforge.mods.toml.
    compileOnly "maven.modrinth:jade:${jade_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered gametest, then exits - non-zero if any failed. The pack's own
        // :nauvis:runGameTestServer runs these too, on a classpath with all five mods.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The bench-recipe datapacks off, which is not the default and cannot be:
            // GameTestServer force-enables every pack it can see, and a bench copy ships
            // under the same id as the timed recipe it replaces. See ModPacks.
            systemProperty 'jaguarm.benchRecipePacks', 'false'
        }

        // Client and server datagen are separate runs since 1.21.4. Models and language go
        // through clientData, loot tables and tags through serverData; running only one
        // silently generates half of what you asked for.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the properties in src/main/templates into the mod metadata.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            facrafting_version     : facrafting_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : 'MIT',
            mod_version            : version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Recipes are generated, never hand-written - so a build that would ship a hand-edited one
// should not succeed. See the root build.gradle.
tasks.named('check') {
    dependsOn rootProject.tasks.named('checkRecipes')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
