license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="JaguarM"
displayURL="https://github.com/JaguarM/ProjectNauvis"
issueTrackerURL="https://github.com/JaguarM/ProjectNauvis/issues"

description='''
Factorio's fluids: pipes, oil wells and the pumpjack, the world's water and the offshore pump.

Every lake and sea generates as water of this mod's own - a bucket of it is an ordinary water
bucket, and it never makes a new source - and the offshore pump is the one thing that draws from
it. The refinery and the chemical plant run Facrafting's fluid recipes; the storage tank is a
length of pipeline that holds twenty-five thousand.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The pack's library: multi-block machines, the views a machine publishes, the screens.
[[dependencies.${mod_id}]]
    modId="nauvis_lib"
    type="required"
    versionRange="[0.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Required: the refinery and the chemical plant are machines that run Facrafting's fluid
# recipes, and a mod that cannot work without another says so.
[[dependencies.${mod_id}]]
    modId="facrafting"
    type="required"
    versionRange="[${facrafting_version},)"
    ordering="AFTER"
    side="BOTH"
