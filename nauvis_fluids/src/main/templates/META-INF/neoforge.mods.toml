license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="JaguarM"
displayURL="https://github.com/JaguarM/ProjectNauvis"
issueTrackerURL="https://github.com/JaguarM/ProjectNauvis/issues"

description='''
Factorio's fluids: barrels first, then pipes, oil, chemistry and nuclear.

Almost none of that is here yet. The mod exists this early because the boiler and the steam
engine are both paid for in pipes, and an ingredient with the wrong id is the one kind of
shortcut this pack does not take.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: without Facrafting the timed recipe drops out and the bench recipe takes over.
[[dependencies.${mod_id}]]
    modId="facrafting"
    type="optional"
    versionRange="[${facrafting_version},)"
    ordering="AFTER"
    side="BOTH"
