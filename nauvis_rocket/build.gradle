// Why things are the way they are: docs/ARCHITECTURE.md (dependencies, Jade), docs/API-26.2.md (datagen, gradle).
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

ext {
    mod_id = 'nauvis_rocket'
    mod_name = 'Nauvis Rocket'
}

version = '0.1.0'
group = 'com.jaguarm.nauvisrocket'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/*.bbmodel'
    exclude '**/.cache'
}

repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }

    mavenCentral()

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    implementation project(':nauvis_lib')

    compileOnly "maven.modrinth:jade:${jade_version}"

    implementation "com.jaguarm.facrafting:facrafting:${facrafting_version}"

    runtimeOnly project(':nauvis_materials')
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'jaguarm.benchRecipePacks', 'false'
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            facrafting_version     : facrafting_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : 'MIT',
            mod_version            : version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('check') {
    dependsOn rootProject.tasks.named('checkRecipes')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
