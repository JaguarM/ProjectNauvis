plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

ext {
    mod_id = 'nauvis'
    mod_name = 'Nauvis'

    // Every mod in the pack whose gametests should run here. A subsystem mod tests its own
    // behaviour, in its own source tree, and these runs are where all of it happens at once on
    // a classpath that has the whole pack on it.
    // The sibling repos count too: Neo Progressive Automation owns the two mining drills, and
    // since they became multi-blocks their tests are as much part of the pack's health as ours.
    pack_gametest_namespaces = 'nauvis,nauvis_machines,nauvis_logistics,nauvis_fluids,' +
            'nauvis_power,neoprogressiveautomation'
}

version = '0.1.0'
group = 'com.jaguarm.nauvis'

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    // Two generated roots, not one. Each datagen run deletes output it does not recognise, so
    // pointing both at the same directory makes whichever ran last wipe the other's work.
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/*.bbmodel'
    exclude '**/.cache'
}

repositories {
    // The NeoForged mirror intermittently serves zero-byte files with HTTP 200 for
    // third-party libraries. exclusiveContent makes Central the only source for these
    // groups, so the broken mirror is never consulted for them. See docs/API-26.2.md for
    // the symptoms; the giveaway is a cache directory named
    // da39a3ee5e6b4b0d3255bfef95601890afd80709, the SHA-1 of the empty string.
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }

    mavenCentral()

    // Jade, for the look-at readout. Runtime only here - the pack ships it, and each subsystem
    // mod's plugin classes only load when it is present.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // The four released mods, pulled in to run the pack from one classpath. runtimeOnly, not
    // implementation, because the pack mod has no compile-time dependency on any of them and
    // must not grow one - the coupling is recipe conditions, not Java. settings.gradle
    // substitutes each of these with the local checkout beside this repo.
    runtimeOnly "com.jaguarm.facrafting:facrafting:${facrafting_version}"
    runtimeOnly "com.jaguarm.neoprogressivematerials:neoprogressivematerials:${neoprogressivematerials_version}"
    runtimeOnly "com.jaguarm.neoprogressiveautomation:neoprogressiveautomation:${neoprogressiveautomation_version}"
    runtimeOnly "com.jaguarm.crumblingore:crumblingore:${crumblingore_version}"

    // The subsystem mods in this repo, on the same terms. This is what makes
    // :nauvis:runServer and :nauvis:runGameTestServer the whole pack rather than the pack mod
    // on its own; each subsystem still builds and runs standalone.
    runtimeOnly project(':nauvis_machines')
    runtimeOnly project(':nauvis_logistics')
    runtimeOnly project(':nauvis_fluids')
    runtimeOnly project(':nauvis_power')

    // Not a dependency of anything, deliberately: it is in the pack because the readout is worth
    // having, and every mod still runs without it.
    runtimeOnly "maven.modrinth:jade:${jade_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', pack_gametest_namespaces
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', pack_gametest_namespaces
        }

        // Runs every registered gametest, then exits - non-zero if any failed. This is the
        // check Claude can run unattended; the client run is for the half that needs eyes.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', pack_gametest_namespaces
        }

        // Client and server datagen are separate runs since 1.21.4. Models and language go
        // through clientData, loot tables and tags through serverData; running only one
        // silently generates half of what you asked for.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the properties in src/main/templates into the mod metadata.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : 'MIT',
            mod_version            : version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Recipes are generated, never hand-written - so a build that would ship a hand-edited one
// should not succeed. The other three catch what compiles, tests clean and is still wrong: an
// unresolvable model reference, a screen drawn through itself, and a copied package that has
// drifted from the copy it is meant to match. See the root build.gradle.
tasks.named('check') {
    dependsOn rootProject.tasks.named('checkRecipes')
    dependsOn rootProject.tasks.named('checkModels')
    dependsOn rootProject.tasks.named('checkGuiLayout')
    dependsOn rootProject.tasks.named('checkDuplicated')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
