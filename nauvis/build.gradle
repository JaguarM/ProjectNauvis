// Why things are the way they are: docs/ARCHITECTURE.md (dependencies, Jade), docs/API-26.2.md (datagen, gradle).
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

ext {
    mod_id = 'nauvis'
    mod_name = 'Nauvis'

    pack_gametest_namespaces = 'nauvis,nauvis_materials,nauvis_machines,nauvis_logistics,nauvis_fluids,' +
            'nauvis_power,nauvis_research,nauvis_mining,nauvis_military,nauvis_rocket'
}

version = '0.1.0'
group = 'com.jaguarm.nauvis'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/*.bbmodel'
    exclude '**/.cache'
}

repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }

    mavenCentral()

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    runtimeOnly "com.jaguarm.facrafting:facrafting:${facrafting_version}"
    runtimeOnly "com.jaguarm.crumblingore:crumblingore:${crumblingore_version}"
    runtimeOnly "com.jaguarm.nauvisterrain:nauvis_terrain:${nauvis_terrain_version}"

    implementation project(':nauvis_lib')
    runtimeOnly project(':nauvis_materials')
    runtimeOnly project(':nauvis_machines')
    runtimeOnly project(':nauvis_logistics')
    runtimeOnly project(':nauvis_fluids')
    runtimeOnly project(':nauvis_power')
    runtimeOnly project(':nauvis_research')
    runtimeOnly project(':nauvis_mining')
    runtimeOnly project(':nauvis_military')
    runtimeOnly project(':nauvis_rocket')

    runtimeOnly "maven.modrinth:jade:${jade_version}"
}

var packConfig = tasks.register('packConfig', Copy) {
    from('pack/config') { exclude 'README.md' }
    into 'run/config'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', pack_gametest_namespaces
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', pack_gametest_namespaces
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', pack_gametest_namespaces
            systemProperty 'jaguarm.benchRecipePacks', 'false'
            // One test, or a few, as often as wanted: -Ptests=nauvis:accumulator_carries_the_night -Prepeat=20
            if (project.hasProperty('tests')) {
                programArguments.addAll('--tests', project.property('tests').toString())
            }
            if (project.hasProperty('repeat')) {
                programArguments.addAll('--repeatCount', project.property('repeat').toString())
            }
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : 'MIT',
            mod_version            : version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn packConfig
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('check') {
    dependsOn rootProject.tasks.named('checkRecipes')
    dependsOn rootProject.tasks.named('checkTechnologies')
    dependsOn rootProject.tasks.named('checkRemovals')
    dependsOn rootProject.tasks.named('checkModels')
    dependsOn rootProject.tasks.named('checkGuiLayout')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
