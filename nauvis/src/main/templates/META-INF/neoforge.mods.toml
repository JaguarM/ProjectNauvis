license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="JaguarM"
displayURL="https://github.com/JaguarM/ProjectNauvis"
issueTrackerURL="https://github.com/JaguarM/ProjectNauvis/issues"

description='''
Project Nauvis, the pack mod. Recreates Factorio in Minecraft.

Holds what belongs to the pack rather than to any one subsystem: the replacement of vanilla
progression, the raw resources the other mods build on, and terrain. The subsystem mods are
usable standalone, so none of this can live inside them.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
