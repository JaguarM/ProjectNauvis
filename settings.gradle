pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'ProjectNauvis'

// The three sibling repos, substituted for their published coordinates so an edit is picked up
// here at once. Gradle matches an included build by directory name and the jars are named after
// the mod ids, so the substitution has to be spelled out.
includeBuild('../Facrafting') {
    dependencySubstitution {
        substitute module('com.jaguarm.facrafting:facrafting') using project(':')
    }
}
includeBuild('../CrumblingOre') {
    dependencySubstitution {
        substitute module('com.jaguarm.crumblingore:crumblingore') using project(':')
    }
}
// Nauvis Terrain builds one mod per Minecraft version; this pack takes the one for its own.
includeBuild('../NauvisTerrain') {
    dependencySubstitution {
        substitute module('com.jaguarm.nauvisterrain:nauvis_terrain') using project(':mc-26.2:neoforge')
    }
}

// The framework, the pack mod, then one mod per subsystem. docs/PLAN.md says what each owns.
include 'nauvis_lib'
include 'nauvis'
include 'nauvis_materials'
include 'nauvis_machines'
include 'nauvis_logistics'
include 'nauvis_fluids'
include 'nauvis_power'
include 'nauvis_research'
include 'nauvis_mining'
include 'nauvis_military'
include 'nauvis_rocket'
