plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

ext {
    mod_id = 'nauvis_military'
    mod_name = 'Nauvis Military'
}

version = '0.1.0'
group = 'com.jaguarm.nauvismilitary'

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/*.bbmodel'
    exclude '**/.cache'
}

repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // The code every machine here is built on: multi-blocks, the views a machine publishes,
    // the screen it is drawn on, and the two seams this mod reads - Bonuses for the damage
    // research and Pollution for what the machines breathe out. Arrows point one way.
    implementation project(':nauvis_lib')

    // Runtime only, so a standalone run of this mod has the mods its recipes name: Facrafting
    // supplies the timed recipe type, Neo Progressive Materials the gears a turret is paid for
    // in, and nauvis_machines the stone brick a wall is made of.
    runtimeOnly "com.jaguarm.facrafting:facrafting:${facrafting_version}"
    runtimeOnly "com.jaguarm.neoprogressivematerials:neoprogressivematerials:${neoprogressivematerials_version}"
    runtimeOnly project(':nauvis_machines')

    // Jade, for the look-at readout: compileOnly, never implementation. The @WailaPlugin
    // class is only loaded when Jade is present, so the mod runs standalone without it.
    compileOnly "maven.modrinth:jade:${jade_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered gametest, then exits - non-zero if any failed. The pack's own
        // :nauvis:runGameTestServer runs these too, on a classpath with the whole pack.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The bench-recipe datapacks off, which is not the default and cannot be:
            // GameTestServer force-enables every pack it can see, and a bench copy ships
            // under the same id as the timed recipe it replaces. See ModPacks.
            systemProperty 'jaguarm.benchRecipePacks', 'false'
        }

        // Client and server datagen are separate runs since 1.21.4. Models and language go
        // through clientData, loot tables and tags through serverData; running only one
        // silently generates half of what you asked for.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the properties in src/main/templates into the mod metadata.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            facrafting_version     : facrafting_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : 'MIT',
            mod_version            : version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Recipes are generated, never hand-written - so a build that would ship a hand-edited one
// should not succeed. See the root build.gradle.
tasks.named('check') {
    dependsOn rootProject.tasks.named('checkRecipes')
}
