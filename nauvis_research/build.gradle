plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

ext {
    mod_id = 'nauvis_research'
    mod_name = 'Nauvis Research'
}

version = '0.1.0'
group = 'com.jaguarm.nauvisresearch'

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    // Two generated roots, not one. Each datagen run deletes output it does not recognise, so
    // pointing both at the same directory makes whichever ran last wipe the other's work.
    srcDir 'src/generated/client'
    srcDir 'src/generated/server'
    exclude '**/*.bbmodel'
    exclude '**/.cache'
}

repositories {
    // See docs/API-26.2.md: the NeoForged mirror intermittently serves zero-byte files with
    // HTTP 200 for these groups. exclusiveContent makes Central the only source for them.
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroup 'com.google.errorprone'
            includeGroup 'com.fasterxml.jackson'
            includeGroup 'org.apache.logging.log4j'
        }
    }

    mavenCentral()

    // Jade, for the look-at readout. See docs/PLAN.md - it is the one mod in the ecosystem
    // actually on 26.2, and its plugin classes only load when it is present.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    // Facrafting is compileOnly as well as runtimeOnly, and it is the only mod here that is.
    // The reason is compat/facrafting/FacraftingLock: gating recipes behind research means
    // naming a Facrafting type, because the hook is Facrafting's. It stays *optional* in
    // neoforge.mods.toml - the class is only loaded behind a ModList check, exactly like the
    // Jade plugins below, so this mod still runs standalone and its bench recipes still exist
    // for that case.
    //
    // Everything else is runtime only. A lab consumes science packs through
    // Capabilities.Item.BLOCK and takes power through Capabilities.Energy.BLOCK, both
    // NeoForge's, so it never needs to know what any other mod is; these are here so a
    // standalone run has the mods its recipes name.
    compileOnly "com.jaguarm.facrafting:facrafting:${facrafting_version}"
    runtimeOnly "com.jaguarm.facrafting:facrafting:${facrafting_version}"
    runtimeOnly "com.jaguarm.neoprogressivematerials:neoprogressivematerials:${neoprogressivematerials_version}"

    // compileOnly, never implementation: the @WailaPlugin class is only loaded when Jade is
    // there, so this mod still runs standalone without it and nothing has to be declared
    // required in neoforge.mods.toml.
    compileOnly "maven.modrinth:jade:${jade_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs every registered gametest, then exits - non-zero if any failed. The pack's own
        // :nauvis:runGameTestServer runs these too, on a classpath with all five mods.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Client and server datagen are separate runs since 1.21.4. Models and language go
        // through clientData, loot tables and tags through serverData; running only one
        // silently generates half of what you asked for.
        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/client/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/server/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Expands the properties in src/main/templates into the mod metadata.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            facrafting_version     : facrafting_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : 'MIT',
            mod_version            : version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into "${layout.buildDirectory.get()}/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Recipes are generated, never hand-written - so a build that would ship a hand-edited one
// should not succeed. See the root build.gradle.
tasks.named('check') {
    dependsOn rootProject.tasks.named('checkRecipes')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
